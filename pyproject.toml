[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-bot"
version = "0.1.0"
description = "Cloud Run Python application for job_bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.140.0",
  "uvicorn[standard]==0.51.0",
  "pypdf==6.14.2",
  "openai==2.48.0",
  "playwright==1.61.0",
  "langchain==1.3.14",
  "langgraph==1.2.9",
  "langchain-openai==1.4.1",
  "langchain-community==0.4.2",
  "tavily-python==0.7.26",
  "langchain-anthropic==1.5.2",
  "langchain-google-genai==4.3.1",
  "langchain-huggingface==1.2.2",
  "langchain-ollama==1.1.0",
  "google-cloud-storage==3.13.0",
  "google-cloud-secret-manager==2.30.0",
  "networkx==3.6.1",
  "python-multipart==0.0.32",
  "beautifulsoup4==4.15.0",
  "httpx==0.28.1",
  "SQLAlchemy==2.0.51",
  "psycopg[binary]==3.3.4",
  "alembic==1.18.5",
  "structlog==26.1.0",
  "redis==8.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "pylint==4.0.5",
  "ruff==0.16.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests"]

[tool.pylint.main]
py-version = "3.11"
fail-under = 6.0


[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-instance-attributes",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "invalid-name",
    "broad-exception-caught",
    "redefined-outer-name",
    "R0917",  # Too many pos vars
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.typecheck]
generated-members = ["op.*"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
