name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  changes:
    name: Detect source/test changes
    runs-on: ubuntu-latest
    outputs:
      src_or_tests: ${{ steps.filter.outputs.src_or_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src_or_tests:
              - 'src/**'
              - 'tests/**'
              - 'migrations/**'
              - 'alembic.ini'
              - 'requirements*.txt'
              - 'pyproject.toml'
              - '.pre-commit-config.yaml'

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.src_or_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements-dev.txt
          mkdir -p .venv/Scripts
          ln -s ../bin/python .venv/Scripts/python.exe

      - name: Run pre-commit checks on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            .venv/bin/python -m pre_commit run --from-ref "$BASE_SHA" --to-ref "$GITHUB_SHA" --show-diff-on-failure
          else
            .venv/bin/python -m pre_commit run --files $(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA") --show-diff-on-failure
          fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies and security tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pip-audit

      - name: Run static security scan (Bandit)
        run: |
          bandit -q -r src -f json -o bandit-report.json || true

          high_issues="$(jq '[.results[] | select(.issue_severity == "HIGH")] | length' bandit-report.json)"
          echo "Bandit found ${high_issues} high-severity issue(s); maximum allowed is 10"

          if (( high_issues > 10 )); then
            echo "::error::Bandit found ${high_issues} high-severity issues, exceeding the limit of 10"
            exit 1
          fi

      - name: Run dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.src_or_tests == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/unit

      - name: Apply database migrations
        if: github.event_name != 'pull_request'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: src
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::The DATABASE_URL GitHub Actions secret is not configured"
            exit 1
          fi
          alembic upgrade head

  coverage:
    name: Coverage Upload
    needs: changes
    if: needs.changes.outputs.src_or_tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        env:
          PYTHONPATH: src
        run: pytest tests/unit --cov=src --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets['CODECOV_TOKEN'] }}

  integration-tests:
    name: Integration Tests
    needs: changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && needs.changes.outputs.src_or_tests == 'true'
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets['OPENAI_API_KEY'] }}
          ALPACA_API_KEY: ${{ secrets['ALPACA_API_KEY'] }}
          ALPACA_SECRET_KEY: ${{ secrets['ALPACA_SECRET_KEY'] }}
        run: |
          test_exit_code=0
          pytest -m "integration" || test_exit_code=$?

          if (( test_exit_code == 5 )); then
            echo "::notice::No integration tests are currently configured"
            exit 0
          fi

          exit "$test_exit_code"
