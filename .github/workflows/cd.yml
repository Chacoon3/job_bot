name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloud-run-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Cloud Run service
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE_NAME }}
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      DATABASE_URL_SECRET: ${{ vars.GCP_DATABASE_URL_SECRET }}
      OPENAI_API_KEY_SECRET: ${{ vars.GCP_OPENAI_API_KEY_SECRET }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          required=(
            PROJECT_ID
            REGION
            SERVICE
            ARTIFACT_REPOSITORY
            WORKLOAD_IDENTITY_PROVIDER
            DEPLOYER_SERVICE_ACCOUNT
            RUNTIME_SERVICE_ACCOUNT
            DATABASE_URL_SECRET
            OPENAI_API_KEY_SECRET
          )

          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions variable ${name} is not configured"
              exit 1
            fi
          done

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Sign in to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve image URI
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image_base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE}"
          echo "uri=${image_base}:${DEPLOY_SHA}" >> "$GITHUB_OUTPUT"
          echo "latest=${image_base}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.image.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - id: deploy
        name: Deploy Cloud Run service
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          region: ${{ env.REGION }}
          service: ${{ env.SERVICE }}
          image: ${{ steps.image.outputs.uri }}
          env_vars: |-
            JOB_BOT_LLM_MODEL=${{ vars.JOB_BOT_LLM_MODEL }}
            DISK_CACHE_DIR=/tmp/job_bot_cache
            DB_POOL_SIZE=${{ vars.DB_POOL_SIZE || '5' }}
            DB_MAX_OVERFLOW=${{ vars.DB_MAX_OVERFLOW || '5' }}
            DB_POOL_TIMEOUT_SECONDS=${{ vars.DB_POOL_TIMEOUT_SECONDS || '30' }}
            DB_POOL_RECYCLE_SECONDS=${{ vars.DB_POOL_RECYCLE_SECONDS || '1800' }}
          env_vars_update_strategy: merge
          secrets: |-
            DATABASE_URL=${{ env.DATABASE_URL_SECRET }}:latest
            OPENAI_API_KEY=${{ env.OPENAI_API_KEY_SECRET }}:latest
          secrets_update_strategy: merge
          flags: >-
            --port=8080
            --no-allow-unauthenticated
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --cpu=${{ vars.CLOUD_RUN_CPU || '1' }}
            --memory=${{ vars.CLOUD_RUN_MEMORY || '1Gi' }}
            --min-instances=${{ vars.CLOUD_RUN_MIN_INSTANCES || '0' }}
            --max-instances=${{ vars.CLOUD_RUN_MAX_INSTANCES || '3' }}

      - id: smoke_auth
        name: Generate smoke-test identity token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.deploy.outputs.url }}
          id_token_include_email: true

      - name: Verify deployed health endpoint
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          ID_TOKEN: ${{ steps.smoke_auth.outputs.id_token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3 4 5; do
            rm -f /tmp/health-response.json
            status="$(
              curl \
                --silent \
                --show-error \
                --output /tmp/health-response.json \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Authorization: Bearer ${ID_TOKEN}" \
                "${SERVICE_URL}/api/health"
            )" || status="000"

            if [[ "$status" == "200" ]]; then
              cat /tmp/health-response.json
              echo
              echo "Cloud Run deployment is healthy: ${SERVICE_URL}"
              exit 0
            fi

            echo "::warning::Health check ${attempt}/5 returned HTTP ${status}"
            if [[ "$attempt" != "5" ]]; then
              sleep $((attempt * 3))
            fi
          done

          echo "::error::Cloud Run health check failed"
          [[ -f /tmp/health-response.json ]] && cat /tmp/health-response.json
          exit 1

      - name: Publish deployment summary
        shell: bash
        run: |
          {
            echo "## Cloud Run deployment"
            echo
            echo "- Service: \`${SERVICE}\`"
            echo "- Region: \`${REGION}\`"
            echo "- Revision source: \`${DEPLOY_SHA}\`"
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- URL: ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
